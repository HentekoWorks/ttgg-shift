<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>報酬明細</title>
<style>
html,body{margin:0;background:#f6f4f4;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;color:#1a1a1a}
@media (prefers-color-scheme:dark){html,body{background:#141213;color:#f1eeef}}
.top{background:#8e3550;height:60px}
.m{padding:60px 20px;text-align:center;font-weight:700;color:#555}
.e{margin:20px auto;max-width:520px;padding:16px;border-radius:14px;background:#fde2e0;color:#8e1b1b;font-weight:800;text-align:center}
.e button{margin-top:12px;height:48px;padding:0 20px;border-radius:12px;border:0;background:#8e3550;color:#fff;font:inherit;font-weight:800}
</style>
</head>
<body>
<div class="top"></div>
<div class="m" id="m">読み込み中…</div>
<script>
// 読み込み役: 画面本体は Google 側(TTGG Ledger の PayApp)から取ってくる。GitHub のこのファイルは今後さわらない。
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbzEdzNGtjiLmM6L75PSX5tJpjhtWohGGJsUVAg9d8kzDAuD6OqkgilOzR9z_ZUfM8Xbxg/exec';
  try {
    var k = new URLSearchParams(location.search).get('k') || '';
    if (/^[0-9a-f]{16,128}$/i.test(k)) { sessionStorage.setItem('led_k', k); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
  function fail(){
    document.getElementById('m').outerHTML = '<div class="e">読み込めませんでした。通信を確認してください。<br><button onclick="location.reload()">もう一度読み込む</button></div>';
  }
  fetch(API + '?app=pay&t=' + Date.now(), { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){
      if (html.indexOf('<html') < 0) throw new Error('bad');
      document.open(); document.write(html); document.close();
    })
    .catch(fail);
})();
</script>
</body>
</html>
