<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>パフォーマンスレポート</title>
<style>
html,body{margin:0;background:#F3F4F1;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;color:#16181A}
@media (prefers-color-scheme:dark){html,body{background:#121413;color:#F1F3EF}}
.top{background:#16181A;height:64px}
.m{padding:60px 20px;text-align:center;font-weight:700;color:#777}
.e{margin:20px auto;max-width:520px;padding:16px;border-radius:14px;background:#FDE2E0;color:#8E1B1B;font-weight:800;text-align:center}
.e button{margin-top:12px;height:48px;padding:0 20px;border-radius:12px;border:0;background:#16181A;color:#fff;font:inherit;font-weight:800}
</style>
</head>
<body>
<div class="top"></div>
<div class="m" id="m">読み込み中…</div>
<script>
// 読み込み役(2026-11-07 版): 画面本体は Google 側(TTGG Performance)から取ってくる。
// 2回目からは前回の画面をこの端末に覚えておいてすぐ出し、裏で新しい版を確かめる(新しい版は次に開いた時から。下に「更新」ボタンも出る)。
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbxn265zCXbRLPXBKWYGCF7VzHm5XfFzbRgfPfDF5u74vK-Z9pAT4lBav5xrVHHJ79S_/exec', APP = '1', KEY = 'appcache_' + location.pathname + '_' + APP;
  try {
    var k = new URLSearchParams(location.search).get('k') || '';
    if (/^[0-9a-f]{16,128}$/i.test(k)) { sessionStorage.setItem('perf_k', k); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
  function ok(h) { return typeof h === 'string' && h.indexOf('<html') >= 0; }
  function show(h) { document.open(); document.write(h); document.close(); }
  function save(h) { try { localStorage.setItem(KEY, h); } catch (e) {} }
  function fail() {
    var m = document.getElementById('m');
    if (m) m.outerHTML = '<div class="e">読み込めませんでした。電波を確認してください。<br><button onclick="location.reload()">もう一度読み込む</button></div>';
  }
  // 裏で新しい版を確かめる処理(画面を出した後のページの中で動くよう、覚えておいた画面に足して出す)
  var REV = '(' + function (API, APP, KEY, cached) {
    fetch(API + '?app=' + APP + '&t=' + Date.now(), { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (h) {
        if (h.indexOf('<html') < 0 || h === cached) return;
        try { localStorage.setItem(KEY, h); } catch (e) {}
        var b = document.createElement('button');
        b.textContent = '新しい版があります(押すと更新)';
        b.setAttribute('style', 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99;height:44px;padding:0 18px;border-radius:22px;border:0;background:#222;color:#fff;font:inherit;font-size:14px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.25)');
        b.onclick = function () { location.reload(); };
        document.body.appendChild(b);
      }).catch(function () {});
  }.toString() + ')';
  var cached = '';
  try { cached = localStorage.getItem(KEY) || ''; } catch (e) {}
  if (ok(cached)) {
    var at = cached.lastIndexOf('</body>');
    var js = '<script>' + REV + '(' + JSON.stringify(API) + ',' + JSON.stringify(APP) + ',' + JSON.stringify(KEY) + ',localStorage.getItem(' + JSON.stringify(KEY) + ')||"");<' + '/script>';
    show(at >= 0 ? cached.slice(0, at) + js + cached.slice(at) : cached + js);
  } else {
    fetch(API + '?app=' + APP + '&t=' + Date.now(), { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (h) { if (!ok(h)) throw new Error('bad'); save(h); show(h); })
      .catch(fail);
  }
})();
</script>
</body>
</html>
