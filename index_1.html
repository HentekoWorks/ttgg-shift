<!doctype html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>勤務表</title>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F2EC;--card:#fff;--soft:#FAF8F3;--ink:#1d1b16;--sub:#77705f;--line:#e6e1d4;--line2:#f1eee6;--y:#F5D33F;--y2:#FFF6CF;--yb:#e0bf2c;
--sat:#2a5d8f;--satbg:#F4F9FE;--sun:#a8322b;--sunbg:#FEF6F5;--gold:#E8C36A;--blk:#17150f;--ok:#1f6b3a;--okbg:#E7F3EA;--ng:#b3362e;--today:#6d4fc2;--amz:#232F3E;--amzt:#FFB547;--dot:#2f6fd6;
--o-bg:#E7F3EA;--o-fg:#1f6b3a;--cx-bg:#FFF1B8;--cx-fg:#6b5400;--mx-bg:#DDF0FA;--mx-fg:#155a7a;--sx-bg:#ECE4FB;--sx-fg:#53379a;--k-bg:#3a3730;--k-fg:#fff;--t-bg:#EEEBE3;--t-fg:#4a463c;--kk-bg:#FCE3E1;--kk-fg:#a8322b;--ky-bg:#fff;--ky-fg:#a8322b;--ky-bd:#e2a19b;--n-bg:#F0EEE8;--n-fg:#77705f;--sd-bg:#FFE5CC;--sd-fg:#8a4b12}
@media (prefers-color-scheme:dark){:root{--bg:#141310;--card:#1e1c18;--soft:#24221d;--ink:#f1ede3;--sub:#a59e8c;--line:#35322b;--line2:#2b2924;--y2:#3a3214;--satbg:#18202a;--sunbg:#2a1a18;--sat:#8bb8e6;--sun:#ef8a80;--okbg:#18301f;--o-bg:#1d3324;--o-fg:#8fd3a5;--cx-bg:#40360e;--cx-fg:#ffe07a;--mx-bg:#123444;--mx-fg:#9bd8f5;--sx-bg:#2c2346;--sx-fg:#cdb8ff;--k-bg:#e8e3d6;--k-fg:#1d1b16;--t-bg:#2f2c25;--t-fg:#ddd6c4;--kk-bg:#47201d;--kk-fg:#ffb3aa;--ky-bg:#1e1c18;--ky-fg:#ffb3aa;--ky-bd:#7a3a33;--n-bg:#2a2823;--n-fg:#a59e8c;--sd-bg:#45300f;--sd-fg:#ffc888}}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink);font-size:17px;-webkit-font-smoothing:antialiased;line-height:1.4;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.top{background:var(--y);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--yb);position:sticky;top:0;z-index:20;color:#1d1b16}
.top .ic{width:44px;height:44px;border-radius:12px;background:var(--blk);display:grid;place-items:center;flex:none}
.top h1{font-size:21px;font-weight:900}
.top .who{margin-left:auto;font-size:13px;font-weight:800;opacity:.75;text-align:right}
.tabs{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:6px 12px;position:sticky;top:69px;z-index:19;overflow-x:auto}
.tabs button{height:44px;padding:0 16px;border-radius:10px;font-weight:800;font-size:15px;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.wide{max-width:none;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:10px;font-weight:800;white-space:nowrap}
.f-o{background:var(--o-bg);color:var(--o-fg)}.f-CX{background:var(--cx-bg);color:var(--cx-fg)}.f-MX{background:var(--mx-bg);color:var(--mx-fg)}.f-SX{background:var(--sx-bg);color:var(--sx-fg)}
.f-k{background:var(--k-bg);color:var(--k-fg)}.f-t{background:var(--t-bg);color:var(--t-fg)}.f-kk{background:var(--kk-bg);color:var(--kk-fg)}.f-ky{background:var(--ky-bg);color:var(--ky-fg);border:1.5px solid var(--ky-bd)}
.f-n{background:var(--n-bg);color:var(--n-fg)}.f-sd{background:var(--sd-bg);color:var(--sd-fg)}
.incent{display:inline-flex;align-items:center;gap:4px;background:var(--blk);color:var(--gold);font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px 3px 8px;white-space:nowrap}
@media (prefers-color-scheme:dark){.incent{background:#000;border:1px solid #4a3f22}}
.muted{color:var(--sub)}
.center{text-align:center}
.btn{height:48px;border-radius:12px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.go{background:var(--ok);color:#fff}
.btn.sec{background:var(--card);border:1px solid var(--line)}
.btn.red{background:var(--card);border:1.5px solid #e2a19b;color:var(--ng)}
.btn.redfill{background:var(--ng);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.loading{padding:60px 0;text-align:center;color:var(--sub);font-weight:700}
.err{background:var(--kk-bg);color:var(--kk-fg);border-radius:14px;padding:16px;font-weight:800}
/* driver */
.today{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.today .b{background:var(--soft);border-radius:14px;padding:12px}
.today .l{font-size:13px;color:var(--sub);font-weight:800}
.today .d{font-size:15px;font-weight:800;margin:2px 0 8px}
.today .chip{font-size:17px;height:44px;width:100%}
.ptitle{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 10px;gap:8px}
.ptitle h2{font-size:20px;font-weight:900}
.pill{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.y{background:var(--cx-bg);color:var(--cx-fg)}.pill.n{background:var(--n-bg);color:var(--n-fg)}
.dl{font-size:13px;color:var(--sub);font-weight:700;margin:-4px 4px 10px}
.list{overflow:hidden;margin-bottom:22px}
.row{display:flex;align-items:center;padding:12px 12px 12px 16px;border-top:1px solid var(--line);min-height:68px;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .lft{flex:1;min-width:0}
.row .l1{display:flex;align-items:baseline;gap:10px}
.row .dt{width:104px;flex:none}
.row .dt b{font-size:26px;font-weight:900;letter-spacing:-.02em}
.row .dt small{font-size:13px;color:var(--sub);font-weight:800;margin-left:4px}
.row .mid{font-size:12px;color:var(--sub);font-weight:700}
.row .incent{margin-top:4px}
.row .chip{font-size:16px;min-width:88px;height:42px;padding:0 12px}
.row .arr{color:#b8b2a2;margin-left:6px;font-size:20px;width:12px}
.row.sat .dt b{color:var(--sat)}.row.sun .dt b{color:var(--sun)}
.row.sat{background:var(--satbg)}.row.sun{background:var(--sunbg)}
.row.past{opacity:.45}
.row.ev{box-shadow:inset 4px 0 0 var(--gold)}
.evh{background:var(--blk);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
.evh .t{font-weight:900;font-size:15px;color:var(--gold)}
.evh .w{font-size:13px;font-weight:700;color:#d9d3c2}
.chg{display:inline-block;background:#E2F0FF;color:#1d4f8a;font-size:11px;font-weight:900;border-radius:6px;padding:1px 6px;margin-left:4px}
.note{font-size:12px;color:var(--sub);text-align:center;margin:-10px 0 20px}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-weight:700}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(20,18,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:92vh;overflow:auto}
@media (min-width:900px){.dim{align-items:center}.sh{border-radius:24px}}
.grab{width:40px;height:5px;border-radius:3px;background:#cfc9ba;margin:0 auto 12px}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.shh b{font-size:22px;font-weight:900}
.shh small{display:block;font-size:14px;color:var(--sub);font-weight:700;margin-top:2px}
.x{width:40px;height:40px;border-radius:50%;background:var(--n-bg);display:grid;place-items:center;color:var(--sub);font-size:18px;flex:none}
.opts{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.opt{display:flex;align-items:center;gap:14px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:64px}
.opt:first-child{border-top:0}
.opt .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none}
.opt b{font-size:17px;font-weight:900;display:block}
.opt small{font-size:13px;color:var(--sub);font-weight:600}
.opt .ck{margin-left:auto;color:#a07a10;font-weight:900;font-size:20px}
.opt.sel{background:var(--y2)}
.lb{font-size:13px;font-weight:900;color:var(--sub);margin:16px 2px 8px}
.hoperow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between;align-items:center;margin-top:12px;width:100%}
.hoperow span{color:var(--ink);font-weight:900}
.hopegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.hopegrid button{height:44px;border-radius:10px;font-weight:800;font-size:14px}
.hopegrid .sel{outline:3px solid var(--ink);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1.2fr 1fr;background:var(--n-bg);border-radius:12px;padding:3px;gap:3px}
.seg button{height:44px;border-radius:10px;font-size:15px;font-weight:800;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.until{margin-top:8px;width:100%;height:48px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);padding:0 12px;font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fgrid button{height:60px;font-size:19px;flex-direction:column;gap:0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900}
.fgrid small{font-size:10px;font-weight:700;opacity:.85}
.fgrid .sel{outline:3px solid var(--ink);outline-offset:1px}
.foot{font-size:12px;color:var(--sub);text-align:center;margin-top:12px}
.linkb{display:block;margin:12px auto 0;font-size:14px;font-weight:800;color:var(--sub);text-decoration:underline;min-height:44px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:800;font-size:15px;z-index:80;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.ng{background:var(--ng);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
.busy{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.01)}
/* pin */
.pin{max-width:380px;margin:40px auto;padding:28px 22px;text-align:center}
.pin h2{font-size:22px;font-weight:900;margin:12px 0 6px}
.pin p{font-size:14px;color:var(--sub);font-weight:700;margin-bottom:16px}
.pin input{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);text-align:center;font-size:26px;letter-spacing:.4em;font-weight:900;margin-bottom:10px}
.pin .btn{width:100%;margin-top:6px}
.pin input::placeholder{letter-spacing:normal;font-size:16px;font-weight:700}
/* admin */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sel{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-weight:800;font-size:16px;max-width:100%}
.search{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;font-weight:700;width:240px;max-width:100%}
.sp{flex:1}
.legend{display:flex;gap:16px;font-size:13px;color:var(--sub);font-weight:700;margin:0 0 10px 4px;align-items:center;flex-wrap:wrap}
.tw{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto;max-height:calc(100vh - 230px);-webkit-overflow-scrolling:touch}
table.m{border-collapse:separate;border-spacing:0;min-width:100%}
table.m th,table.m td{text-align:center;background:var(--card)}
table.m .nm{position:sticky;left:0;z-index:3;text-align:left;padding:0 12px;min-width:132px;max-width:132px;font-size:12px;color:var(--sub);font-weight:800;border-right:1px solid var(--line)}
table.m thead th{position:sticky;z-index:4}
table.m thead tr.evr th{top:0;height:40px;padding:4px 2px}
table.m thead tr.dh th{top:40px;padding:6px 0;border-bottom:3px solid var(--y);min-width:76px}
table.m thead .nm{z-index:6}
.band{background:var(--blk);color:var(--gold);border-radius:9px;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden}
.band span{color:#cfc8b6;font-weight:700;font-size:11px}
.dh b{display:block;font-size:16px;font-weight:900}.dh small{font-size:11px;color:var(--sub);font-weight:700}
th.sat b{color:var(--sat)}th.sun b{color:var(--sun)}
.m .sat{background:var(--satbg)!important}.m .sun{background:var(--sunbg)!important}
.m th.tdy{background:var(--y2)!important;box-shadow:inset 0 3px 0 var(--today)}.m th.tdy small{color:var(--today);font-weight:900}
.m tr.sum td{font-size:12px;font-weight:700;padding:6px 2px;border-bottom:1px solid var(--line2);white-space:nowrap}
.m tr.sum .nm{border-bottom:1px solid var(--line2)}
.lsub{display:block;font-size:10px;font-weight:700;opacity:.8}
.m tr.sep th{white-space:nowrap;overflow:visible}
.m tr.sep td,.m tr.sep th{background:var(--y)!important;color:#1d1b16!important;font-size:13px;font-weight:900;padding:7px 12px;text-align:left}
.m tr.drv td{padding:6px 3px;border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
.m tr.drv .nm{font-size:15px;color:var(--ink);font-weight:900;border-bottom:1px solid var(--line);white-space:normal;line-height:1.25}
.cell{width:100%;display:block}
.cell .h{font-size:10.5px;color:#a29b88;font-weight:700;height:15px;margin-bottom:3px;white-space:nowrap}
.cell .h.hs{color:var(--sub);font-weight:900}
.cell .chip{position:relative;height:40px;width:100%;font-size:15px}
.dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--dot)}
.short{color:var(--ng);font-weight:900}.okk{color:var(--ok);font-weight:900}.ovr{color:#155a7a;font-weight:900}
/* capacity */
table.c{border-collapse:separate;border-spacing:0;min-width:100%}
table.c th,table.c td{background:var(--card)}
table.c .nm{position:sticky;left:0;z-index:3;text-align:left;min-width:170px;padding:10px 14px;font-size:14px;font-weight:900;border-right:1px solid var(--line)}
table.c .nm small{display:block;font-size:11px;color:var(--sub);font-weight:700}
table.c thead th{position:sticky;top:0;z-index:4;padding:8px 0;border-bottom:3px solid var(--y);min-width:96px;text-align:center}
table.c thead .nm{z-index:6}
table.c td{text-align:center;padding:8px 4px;border-top:1px solid var(--line2);border-left:1px solid var(--line2)}
table.c tr.grp th{text-align:left;font-size:11px;letter-spacing:.12em;padding:7px 14px;font-weight:900}
table.c tr.grp.am th{background:var(--amz);color:var(--amzt)}
table.c tr.grp.tt th{background:var(--y);color:#3d3200}
.c .big{font-size:20px;font-weight:900}
.c .two b{display:block;font-size:18px;font-weight:900}
.c .two span{font-size:12px;color:var(--sub);font-weight:700}
.c .dr{display:flex;justify-content:space-between;font-size:12px;font-weight:900;padding:1px 6px}
.c .dr i{font-style:normal;color:var(--sub);font-weight:800}
.c .ngp{color:#fff;background:var(--ng);border-radius:6px;padding:0 6px}
.c input{width:54px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--soft);text-align:center;font-weight:800;font-size:15px;margin:1px}
.c .trip{display:flex;justify-content:center;gap:2px}
.capnote{font-size:12px;color:var(--sub);margin-top:10px;font-weight:600}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.hd h2{font-size:22px;font-weight:900}
.hd .upd{font-size:13px;color:var(--sub);font-weight:700}
/* settings */
.set{max-width:720px;margin:0 auto}
.set .card{padding:20px;margin-bottom:16px}
.set h3{font-size:18px;font-weight:900;margin-bottom:4px}
.set .s{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:14px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:800;color:var(--sub);display:block}
.fld input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 12px;margin-top:4px;font-weight:700}
.fld .full{grid-column:1/-1}
.tg{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;min-height:64px}
.tg b{font-size:15px;font-weight:900;display:block}.tg small{font-size:12px;color:var(--sub);font-weight:700}
.sw{width:52px;height:32px;border-radius:16px;background:#cfc9ba;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.evl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.evl:first-of-type{border-top:0}
.evl .t{flex:1;font-weight:800}
.evl .t small{display:block;color:var(--sub);font-size:12px;font-weight:700}
.dlg .msg{font-size:16px;font-weight:700;margin:12px 0 18px;line-height:1.6}
.dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media print{
  .top,.tabs,.bar,.legend,.noprint,.toast{display:none!important}
  body{background:#fff}
  .wide{padding:0}
  .tw{max-height:none;overflow:visible;border:0}
  table.m .nm,table.m thead th{position:static}
  .cell .chip{height:22px;font-size:11px;border-radius:5px}
  .cell .h{font-size:8px;height:10px}
  table.m tr.drv td{padding:2px 1px}
  table.m thead tr.dh th{min-width:0}
  @page{size:A4 landscape;margin:8mm}
}
@media (max-width:600px){
  .row .dt{width:96px}
  .wide{padding:12px}
  .bar{gap:8px;margin-bottom:10px}
  .bar .sel{flex:1 1 100%;min-width:0}
  .bar .pill{font-size:12px;padding:3px 10px}
  .search{flex:1 1 100%;width:auto;min-width:0;height:44px}
  .m tr.sum td{font-size:10px;letter-spacing:-.03em}
  #prt{display:none}
  .legend{font-size:11px;gap:10px;margin-bottom:8px}
  .legend span:first-child{display:none}
  table.m .nm{min-width:84px;max-width:84px;padding:0 8px;font-size:10.5px}
  table.m tr.drv .nm{font-size:13px}
  table.m thead tr.dh th{min-width:64px}
  .tw{max-height:calc(100vh - 200px)}
  table.c .nm{min-width:110px;padding:8px 10px;font-size:13px}
}
</style>
</head>
<body>
<div class="top">
  <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
  <h1>勤務表</h1>
  <div class="who" id="who"></div>
</div>
<div id="tabs"></div>
<div id="main"><div class="loading">読み込み中…</div></div>
<div id="layer"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbxnCLyLVAyzmJNG4UvA2KyuFlRdT_KghSUWApmpmMX4qzbfw6RdDmsVChKSLs1qvahd/exec';
// 本人の鍵: ポータルから ?k=... で開く。読んだらアドレス欄から消して、この端末に覚えておく
var K = (function(){
  var k = '';
  try { k = new URLSearchParams(location.search).get('k') || new URLSearchParams(location.hash.slice(1)).get('k') || ''; } catch(e){}
  if (!/^[0-9a-f]{16,128}$/i.test(k)) k = '';
  try {
    if (k) { sessionStorage.setItem('sched_k', k); history.replaceState(null, '', location.pathname); }
    else k = sessionStorage.getItem('sched_k') || '';
  } catch(e){}
  return k;
})();
var S = { boot: null, tab: 'me', adm: null, periodId: '', token: '', q: '', capEdit: false };
var WD = ['日','月','火','水','木','金','土'];
var HOPE = {
  'なし': { t: '希望なし', s: '勤務条件の希望はありません', c: 'f-n', i: '−' },
  '休': { t: '休み希望', s: 'この日は休みを希望します', c: 'f-kk', i: '休' },
  'CX': { t: 'CXのみ', s: 'CXであれば勤務できます', c: 'f-CX', i: 'CX' },
  'MX': { t: 'MXのみ', s: 'MXであれば勤務できます', c: 'f-MX', i: 'MX' },
  'SX': { t: 'SXのみ', s: 'SXであれば勤務できます', c: 'f-SX', i: 'SX' },
  '相談': { t: '要相談', s: '勤務条件を管理者へ伝えます', c: 'f-sd', i: '相談' }
};
var HOPE_ORDER = ['なし','休','CX','MX','SX','相談'];
var FIN = {
  '○': { t: '○ 勤務', s: '勤務', c: 'f-o' }, 'CX': { t: 'CXのみ', s: 'CXのみ', c: 'f-CX' }, 'MX': { t: 'MXのみ', s: 'MXのみ', c: 'f-MX' }, 'SX': { t: 'SXのみ', s: 'SXのみ', c: 'f-SX' },
  '管理': { t: '管理', s: '管理', c: 'f-k' }, '▲': { t: '▲ 未定', s: '未定', c: 'f-t' }, '希休': { t: '希休', s: '希望の休み', c: 'f-kk' }, '休': { t: '休', s: '管理の休み', c: 'f-ky' }
};
var FIN_ORDER = ['○','CX','MX','SX','管理','▲','希休','休'];
var AUTO = { '': '○', 'なし': '○', '休': '希休', 'CX': 'CX', 'MX': 'MX', 'SX': 'SX', '相談': '○' };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function md(d){ return Number(d.slice(5,7)) + '/' + Number(d.slice(8,10)); }
function wdOf(d){ return new Date(d + 'T00:00:00').getDay(); }
function wcls(d){ var w = wdOf(d); return w === 0 ? 'sun' : w === 6 ? 'sat' : ''; }
function dlTxt(s){ if (!s) return ''; return md(s.slice(0,10)) + '（' + WD[wdOf(s.slice(0,10))] + '）' + s.slice(11,16); }

function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(function(r){ if (!r.ok) throw new Error('通信エラー(' + r.status + ')'); return r.json(); })
    .catch(function(e){ if (e && e.message && e.message.indexOf('通信') === 0) throw e; throw new Error('通信できませんでした。電波を確認して、もう一度お試しください'); })
    .then(function(o){ if (!o || !o.ok) throw new Error((o && o.err) || 'エラーが起きました'); return o.val; });
}
var toastT;
function toast(msg, kind){
  var el = document.createElement('div'); el.className = 'toast ' + (kind || ''); el.textContent = msg;
  document.querySelectorAll('.toast').forEach(function(x){ x.remove(); });
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(function(){ el.remove(); }, kind === 'ng' ? 4500 : 2400);
}
function errMsg(e){ var m = (e && e.message) || String(e); return m.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''); }
var busyN = 0;
function busy(on){ busyN += on ? 1 : -1; var b = document.querySelector('.busy'); if (busyN > 0 && !b){ b = document.createElement('div'); b.className = 'busy'; document.body.appendChild(b); } if (busyN <= 0 && b) b.remove(); }
function closeLayer(){ $('layer').innerHTML = ''; }
function openSheet(html){
  $('layer').innerHTML = '<div class="dim" id="dim"><div class="sh" role="dialog" aria-modal="true">' + html + '</div></div>';
  $('dim').addEventListener('click', function(e){ if (e.target.id === 'dim') closeLayer(); });
}
function confirmBox(title, msg, okText, danger){
  return new Promise(function(res){
    openSheet('<div class="dlg"><div class="grab"></div><div class="shh"><div><b>' + esc(title) + '</b></div></div><div class="msg">' + msg + '</div><div class="acts"><button class="btn sec" id="cNo">やめる</button><button class="btn ' + (danger ? 'redfill' : 'pri') + '" id="cOk">' + esc(okText) + '</button></div></div>');
    $('cNo').onclick = function(){ closeLayer(); res(false); };
    $('cOk').onclick = function(){ closeLayer(); res(true); };
  });
}
function tok(){ if (S.token) return S.token; try { return localStorage.getItem('sched_tok_' + S.boot.me.id) || ''; } catch(e){ return ''; } }
function setTok(t){ S.token = t; try { if (t) localStorage.setItem('sched_tok_' + S.boot.me.id, t); else localStorage.removeItem('sched_tok_' + S.boot.me.id); } catch(e){} }

/* ===== 起動 ===== */
function start(){
  call('apiBoot', K).then(function(b){
    S.boot = b;
    $('who').textContent = b.me.name + 'さん';
    if (!b.me.inList && b.me.level) S.tab = 'master';
    renderTabs(); render();
  }).catch(function(e){
    $('main').innerHTML = '<div class="wrap"><div class="err">' + esc(errMsg(e)) + '</div></div>';
  });
}
function renderTabs(){
  var b = S.boot;
  if (!b.me.level){ $('tabs').innerHTML = ''; return; }
  var t = [];
  if (b.me.inList) t.push(['me','自分の勤務']);
  t.push(['master','勤務表']); t.push(['cap','日別台数']);
  if (b.me.level === 'edit') t.push(['set','期間・セール']);
  $('tabs').innerHTML = '<div class="tabs" role="tablist">' + t.map(function(x){ return '<button class="' + (S.tab === x[0] ? 'on' : '') + '" data-t="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  $('tabs').querySelectorAll('button').forEach(function(btn){ btn.onclick = function(){ S.tab = btn.dataset.t; S.capEdit = false; renderTabs(); render(); window.scrollTo(0,0); }; });
}
function render(){
  if (S.tab === 'me') return renderDriver();
  if (!tok()) return renderPin();
  if (!S.adm) return loadAdmin(S.periodId);
  if (S.tab === 'master') return renderMaster();
  if (S.tab === 'cap') return renderCap();
  if (S.tab === 'set') return renderSet();
}

/* ===== ドライバー ===== */
function finChip(f, cls){ var x = FIN[f] || { t: f || '−', c: 'f-n' }; return '<span class="chip ' + x.c + ' ' + (cls || '') + '">' + esc(x.t) + '</span>'; }
function hopeChip(h){ var x = HOPE[h] || HOPE['なし']; return '<span class="chip ' + x.c + '">' + esc(x.t) + '</span>'; }
function renderDriver(){
  var d = S.boot.driver;
  if (!d){ $('main').innerHTML = '<div class="wrap"><div class="empty">勤務表の対象ではありません</div></div>'; return; }
  var h = '<div class="wrap">';
  function box(lbl, x){
    var c = x.published ? finChip(x.final) : '<span class="chip f-n">未公開</span>';
    return '<div class="b"><div class="l">' + lbl + '</div><div class="d">' + md(x.date) + ' ' + WD[wdOf(x.date)] + '曜</div>' + c + '</div>';
  }
  h += '<div class="card today">' + box('今日', d.today) + box('明日', d.tomorrow) + '</div>';
  if (!d.periods.length) h += '<div class="card empty">公開中の勤務表はありません</div>';
  var tdy = S.boot.today;
  d.periods.forEach(function(p){
    var st = p.accepting ? '<span class="pill y">希望受付中</span>' : p.published ? '<span class="pill ok">公開中</span>' : '<span class="pill n">準備中</span>';
    h += '<div class="ptitle"><h2>' + md(p.start) + '〜' + md(p.end) + '</h2>' + st + '</div>';
    if (p.accepting && p.deadline) h += '<div class="dl">締切 ' + dlTxt(p.deadline) + '</div>';
    h += '<div class="card list">';
    var lastEv = '';
    p.days.forEach(function(x){
      var evId = x.event ? x.event.id : '';
      if (evId && evId !== lastEv){
        h += '<div class="evh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8C36A" stroke-width="2.2"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.7z"/></svg><span class="t">' + esc(x.event.name + ' ' + x.event.label) + '</span><span class="w">' + md(x.event.start) + '〜' + md(x.event.end) + '</span></div>';
      }
      lastEv = evId;
      var right, mid;
      if (x.published){ right = finChip(x.final); mid = (x.hope === 'なし' ? '希望なし' : '希望 ' + HOPE[x.hope].t) + (x.changed ? '<span class="chg">変更あり</span>' : ''); }
      else if (p.accepting){ right = hopeChip(x.hope); mid = x._pending ? '<span class="chg" style="background:var(--cx-bg);color:var(--cx-fg)">保存中…</span>' : ''; }
      else { right = '<span class="chip f-n">未公開</span>'; mid = x.hope === 'なし' ? '希望なし' : '希望 ' + HOPE[x.hope].t; }
      var can = p.accepting && x.date >= tdy;
      h += '<button class="row ' + wcls(x.date) + (x.date < tdy ? ' past' : '') + (evId ? ' ev' : '') + '" ' + (can ? 'data-d="' + x.date + '"' : 'disabled') + '>' +
        '<div class="lft"><div class="l1"><div class="dt"><b>' + md(x.date) + '</b><small>' + WD[wdOf(x.date)] + '</small></div><div class="mid">' + mid + '</div></div>' +
        (evId ? '<span class="incent">★ インセンティブ対象日</span>' : '') + '</div>' + right + '<span class="arr">' + (can ? '›' : '') + '</span></button>';
    });
    h += '</div>';
    if (p.accepting) h += '<div class="note">日付をタップすると希望を選べます。選ぶと自動で保存されます。</div>';
  });
  h += '</div>';
  $('main').innerHTML = h;
  $('main').querySelectorAll('.row[data-d]').forEach(function(r){ r.onclick = function(){ hopeSheet(r.dataset.d); }; });
}
function findDay(date){
  var out = null;
  S.boot.driver.periods.forEach(function(p){ p.days.forEach(function(x){ if (x.date === date) out = x; }); });
  return out;
}
function hopeSheet(date){
  var x = findDay(date);
  var h = '<div class="grab"></div><div class="shh"><div><b>' + md(date) + ' ' + WD[wdOf(date)] + '曜日</b><small>希望する勤務条件を選んでください</small></div><button class="x" id="sx" aria-label="閉じる">✕</button></div><div class="opts">';
  HOPE_ORDER.forEach(function(k){
    var o = HOPE[k];
    h += '<button class="opt' + (x.hope === k ? ' sel' : '') + '" data-h="' + k + '"><span class="ico ' + o.c + '">' + o.i + '</span><span><b>' + o.t + '</b><small>' + o.s + '</small></span>' + (x.hope === k ? '<span class="ck">✓</span>' : '') + '</button>';
  });
  h += '</div>';
  openSheet(h);
  $('sx').onclick = closeLayer;
  document.querySelectorAll('.opt[data-h]').forEach(function(b){ b.onclick = function(){
    var v = b.dataset.h; closeLayer();
    if (v === x.hope) return;
    var prev = x.hope; x.hope = v; x._pending = true; renderDriver();
    call('apiSetHope', K, date, v).then(function(){ x._pending = false; renderDriver(); toast(md(date) + ' を「' + HOPE[v].t + '」で保存しました', 'ok'); })
      .catch(function(e){ x.hope = prev; x._pending = false; renderDriver(); toast('保存されていません。' + errMsg(e), 'ng'); });
  }; });
}

/* ===== PIN ===== */
function renderPin(){
  var first = !S.boot.hasPin;
  var h = '<div class="wrap"><div class="card pin"><div class="top" style="position:static;background:none;border:0;justify-content:center;padding:0"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div></div>' +
    '<h2>' + (first ? '暗証番号を決めてください' : '暗証番号を入力') + '</h2><p>' + (first ? '管理画面を開くための数字6桁です。忘れた時はJayさんへ。' : '管理画面を開くための数字6桁') + '</p>' +
    '<input id="pin1" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="暗証番号">' +
    (first ? '<input id="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="もう一度" aria-label="確認">' : '') +
    '<button class="btn pri" id="pinGo">開く</button></div></div>';
  $('main').innerHTML = h;
  $('pin1').focus();
  var go = function(){
    var a = $('pin1').value, b = first ? $('pin2').value : '';
    if (!/^\d{6}$/.test(a)){ toast('数字6桁で入力してください', 'ng'); return; }
    busy(true);
    call('apiPin', K, a, b).then(function(r){ busy(false); setTok(r.token); S.boot.hasPin = true; loadAdmin(S.periodId); })
      .catch(function(e){ busy(false); toast(errMsg(e), 'ng'); $('pin1').value = ''; if (first) $('pin2').value = ''; });
  };
  $('pinGo').onclick = go;
  $('main').querySelectorAll('input').forEach(function(i){ i.onkeydown = function(e){ if (e.key === 'Enter') go(); }; });
}

/* ===== 管理データ ===== */
function admCall(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  return call.apply(null, [fn, K, tok()].concat(args)).then(function(r){ busy(false); S.adm = r; if (r.period) S.periodId = r.period.id; return r; })
    .catch(function(e){
      busy(false);
      var m = errMsg(e);
      if (m.indexOf('PIN_REQUIRED') >= 0){ setTok(''); S.adm = null; renderPin(); throw new Error('silent'); }
      toast(m, 'ng'); throw e;
    });
}
// 変更系: 画面は先に変え、裏で保存。失敗したら戻す(S.adm は上書きしない)
function admSave(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  S.pending = (S.pending || 0) + 1;
  return call.apply(null, [fn, K, tok()].concat(args)).then(function(r){ S.pending--; return r; })
    .catch(function(e){
      S.pending--;
      var m = errMsg(e);
      if (m.indexOf('PIN_REQUIRED') >= 0){ setTok(''); S.adm = null; renderPin(); }
      throw new Error(m);
    });
}
function loadAdmin(pid){
  $('main').innerHTML = '<div class="loading">読み込み中…</div>';
  admCall('apiAdmin', pid || '').then(function(){ render(); }).catch(function(){});
}
function canEdit(){ return S.adm && S.adm.me.level === 'edit'; }
function evOf(d){ return (S.adm.events || []).filter(function(e){ return d >= e.start && d <= e.end; })[0] || null; }
function cellOf(mid, d){ return S.adm.cells[mid + '_' + d] || { h: '', f: '' }; }
function effF(c){ return c.f || AUTO[c.h || '']; }
function periodLabel(p){ return md(p.start) + '〜' + md(p.end) + (p.published ? '（公開中）' : p.accepting ? '（受付中）' : '（準備中）'); }
function periodSelect(){
  var a = S.adm;
  if (!a.periods.length) return '';
  return '<select class="sel" id="psel" aria-label="期間">' + a.periods.map(function(p){ return '<option value="' + p.id + '"' + (a.period && p.id === a.period.id ? ' selected' : '') + '>' + esc(periodLabel(p)) + '</option>'; }).join('') + '</select>';
}
function bindPsel(){ var s = $('psel'); if (s) s.onchange = function(){ S.periodId = s.value; S.newP = false; S.capEdit = false; loadAdmin(s.value); }; }
function noPeriod(){
  $('main').innerHTML = '<div class="wrap"><div class="card empty">勤務表の期間がまだありません。' + (canEdit() ? '<br><br><button class="btn pri" id="np">＋ 期間を作る</button>' : '') + '</div></div>';
  if ($('np')) $('np').onclick = function(){ S.tab = 'set'; S.newP = true; renderTabs(); render(); };
}

/* ===== 勤務表(マスター) ===== */
function renderMaster(){
  var a = S.adm;
  if (!a.period) return noPeriod();
  var p = a.period, ds = a.dates;
  var mem = a.members;
  var oldTw = document.querySelector('.tw'), keep = oldTw && S.tab === 'master' && S.keepScroll ? [oldTw.scrollLeft, oldTw.scrollTop] : null;
  S.keepScroll = false;
  var inputN = a.members.filter(function(m){ return a.hopeCount[m.id] > 0; }).length;
  var h = '<div class="wide"><div class="bar">' + periodSelect() +
    (p.published ? '<span class="pill ok">● 公開中</span>' : '<span class="pill n">未公開</span>') +
    (p.accepting ? '<span class="pill y">希望受付中</span>' : '<span class="pill n">希望受付 終了</span>') +
    '<span class="pill n">希望入力 ' + inputN + '／' + a.members.length + '名</span><div class="sp"></div>' +
    '<input class="search" id="q" placeholder="ドライバーを検索" value="' + esc(S.q) + '" aria-label="検索">' +
    '<button class="btn pri noprint" id="prt">PDF・印刷</button></div>' +
    '<div class="legend"><span>上：本人希望（小さい文字）</span><span>下：確定勤務' + (canEdit() ? '（タップで変更）' : '（見るだけ）') + '</span><span><i class="dot" style="position:static;display:inline-block;margin-right:4px"></i>希望から変えた所</span></div>';
  h += '<div class="tw"><table class="m"><thead><tr class="evr"><th class="nm"></th>';
  // セール帯
  var i = 0;
  while (i < ds.length){
    var e = evOf(ds[i]);
    var j = i + 1;
    while (j < ds.length && (evOf(ds[j]) || {}).id === (e || {}).id) j++;
    h += '<th colspan="' + (j - i) + '">' + (e ? '<div class="band">★ ' + esc(e.name + ' ' + e.label) + '<span>' + md(e.start) + '〜' + md(e.end) + '</span></div>' : '') + '</th>';
    i = j;
  }
  h += '</tr><tr class="dh"><th class="nm">項目／日付</th>' + ds.map(function(d){ return '<th class="' + wcls(d) + (d === a.today ? ' tdy' : '') + '"><b>' + md(d) + '</b><small>' + WD[wdOf(d)] + (d === a.today ? '・本日' : '') + '</small></th>'; }).join('') + '</tr></thead><tbody>';
  // 集計
  var cnt = ds.map(function(d){
    var c = { o: 0, CX: 0, MX: 0, SX: 0, k: 0 };
    a.members.forEach(function(m){ var f = effF(cellOf(m.id, d)); if (f === '○') c.o++; else if (f === 'CX' || f === 'MX' || f === 'SX') c[f]++; else if (f === '管理') c.k++; });
    return c;
  });
  function srow(lbl, f){ return '<tr class="sum"><th class="nm">' + lbl + '</th>' + ds.map(function(d, ix){ return '<td class="' + wcls(d) + '">' + f(d, ix) + '</td>'; }).join('') + '</tr>'; }
  h += srow('必要台数', function(d){ var c = a.capacity[d]; return c && c.target !== '' ? c.target : '−'; });
  h += srow('割り当て<small class="lsub">CX／MX／SX</small>', function(d){ var c = a.capacity[d]; return c && c.asg[0] !== '' ? c.asg.join('／') : '−'; });
  h += srow('勤務<small class="lsub">○／CX／MX／SX</small>', function(d, ix){ var c = cnt[ix]; return c.o + '／' + c.CX + '／' + c.MX + '／' + c.SX; });
  h += srow('管理', function(d, ix){ return cnt[ix].k; });
  h += '<tr class="sep"><th class="nm" style="text-align:left" id="sepn">ドライバー（' + mem.length + '名）</th><td colspan="' + ds.length + '"></td></tr>';
  mem.forEach(function(m){
    h += '<tr class="drv" data-n="' + esc(m.name.replace(/\s/g, '')) + '"><th class="nm">' + esc(m.name) + '</th>';
    ds.forEach(function(d){
      var c = cellOf(m.id, d), f = effF(c), hp = c.h || 'なし';
      var diff = c.f && c.f !== AUTO[c.h || ''];
      var x = FIN[f] || { t: f, c: 'f-n' };
      h += '<td class="' + wcls(d) + '"><button class="cell" data-m="' + m.id + '" data-d="' + d + '"' + (canEdit() ? '' : ' disabled') + '><div class="h' + (hp !== 'なし' ? ' hs' : '') + '">' + esc(HOPE[hp] ? HOPE[hp].t : hp) + '</div><span class="chip ' + x.c + '">' + esc(f) + (diff ? '<i class="dot" title="希望から変更"></i>' : '') + '</span></button></td>';
    });
    h += '</tr>';
  });
  h += '<tr id="noq" style="display:none"><td colspan="' + (ds.length + 1) + '" class="empty">該当するドライバーがいません</td></tr>';
  h += '</tbody></table></div></div>';
  $('main').innerHTML = h;
  bindPsel();
  var tw = document.querySelector('.tw'), td = document.querySelector('th.tdy'), nm = document.querySelector('table.m thead tr.dh .nm');
  if (keep && tw){ tw.scrollLeft = keep[0]; tw.scrollTop = keep[1]; }
  else if (tw && td && nm) tw.scrollLeft = Math.max(0, td.offsetLeft - nm.offsetWidth - 8);
  applyQ();
  // 日本語入力の変換中は絞り込まない(変換が崩れるため)
  $('q').addEventListener('input', function(e){ if (e.isComposing) return; S.q = this.value; applyQ(); });
  $('q').addEventListener('compositionend', function(){ S.q = this.value; applyQ(); });
  $('prt').onclick = function(){ window.print(); };
  if (canEdit()) $('main').querySelectorAll('.cell[data-m]').forEach(function(b){ b.onclick = function(){ finalSheet(b.dataset.m, b.dataset.d); }; });
}

function applyQ(){
  var q = (S.q || '').replace(/\s/g, '');
  var n = 0;
  document.querySelectorAll('tr.drv').forEach(function(tr){ var hit = !q || tr.dataset.n.indexOf(q) >= 0; tr.style.display = hit ? '' : 'none'; if (hit) n++; });
  if ($('sepn')) $('sepn').textContent = 'ドライバー（' + n + '名）';
  if ($('noq')) $('noq').style.display = n ? 'none' : '';
}
function finalSheet(mid, date){
  var a = S.adm, ds = a.dates;
  var m = a.members.filter(function(x){ return x.id === mid; })[0];
  var c = cellOf(mid, date), cur = effF(c);
  var later = ds.filter(function(d){ return d > date; });
  var st = { mode: 'one', until: later.length ? later[Math.min(6, later.length - 1)] : date, hopeOpen: false };
  var e = evOf(date);
  function draw(){
    var hp = c.h || 'なし';
    var h = '<div class="grab"></div><div class="shh"><div><b>' + esc(m.name) + '</b><small>' + md(date) + ' ' + WD[wdOf(date)] + '曜' + (e ? ' ・ <span style="color:#a07a10;font-weight:900">★ インセンティブ対象日</span>' : '') + '</small></div><button class="x" id="sx" aria-label="閉じる">✕</button></div>';
    h += '<button class="hoperow" id="hp">本人希望<span>' + esc(HOPE[hp].t) + ' ›</span></button>';
    if (st.hopeOpen){
      h += '<div class="hopegrid">' + HOPE_ORDER.map(function(k){ return '<button class="' + HOPE[k].c + (k === hp ? ' sel' : '') + '" data-hp="' + k + '">' + HOPE[k].t + '</button>'; }).join('') + '</div>';
    }
    h += '<div class="lb">① どこまで同じにする？</div><div class="seg"><button data-mo="one" class="' + (st.mode === 'one' ? 'on' : '') + '">この日だけ</button><button data-mo="until" class="' + (st.mode === 'until' ? 'on' : '') + '"' + (later.length ? '' : ' disabled') + '>日付を選ぶ</button><button data-mo="end" class="' + (st.mode === 'end' ? 'on' : '') + '"' + (later.length ? '' : ' disabled') + '>最後まで</button></div>';
    if (st.mode === 'until'){
      h += '<select class="until" id="un">' + later.map(function(d){ var n = ds.indexOf(d) - ds.indexOf(date) + 1; return '<option value="' + d + '"' + (d === st.until ? ' selected' : '') + '>' + md(d) + '（' + WD[wdOf(d)] + '）まで ・ ' + n + '日分</option>'; }).join('') + '</select>';
    }
    if (st.mode === 'end') h += '<div class="foot" style="margin-top:8px">' + md(date) + '〜' + md(ds[ds.length - 1]) + '（' + (later.length + 1) + '日分）</div>';
    h += '<div class="lb">② 勤務を選ぶ（押すと保存）</div><div class="fgrid">' + FIN_ORDER.map(function(k){ return '<button class="' + FIN[k].c + (k === cur && st.mode === 'one' ? ' sel' : '') + '" data-f="' + k + '">' + esc(k) + '<small>' + FIN[k].s + '</small></button>'; }).join('') + '</div>';
    if (c.f && st.mode === 'one') h += '<button class="linkb" id="rst">希望どおり（' + AUTO[c.h || ''] + '）に戻す</button>';
    h += '<div class="foot">「この日だけ」なら勤務を1回押すだけで保存されます</div>';
    openSheet(h);
    $('sx').onclick = closeLayer;
    $('hp').onclick = function(){ st.hopeOpen = !st.hopeOpen; draw(); };
    document.querySelectorAll('[data-hp]').forEach(function(b){ b.onclick = function(){
      var v = b.dataset.hp; closeLayer();
      var key = mid + '_' + date, before = a.cells[key] ? { h: a.cells[key].h, f: a.cells[key].f } : null;
      var cc = a.cells[key] || { h: '', f: '' }; cc.h = v; a.cells[key] = cc;
      if (!before || !before.h) a.hopeCount[mid] = (a.hopeCount[mid] || 0) + 1;
      S.keepScroll = true; renderMaster();
      admSave('apiSetHopeAdmin', a.period.id, mid, date, v).then(function(){ toast(m.name + ' ' + md(date) + ' の希望を「' + HOPE[v].t + '」で保存しました', 'ok'); })
        .catch(function(e){ if (!S.adm) return; if (before) a.cells[key] = before; else delete a.cells[key]; if (!before || !before.h) a.hopeCount[mid]--; S.keepScroll = true; renderMaster(); toast('保存されていません。' + e.message, 'ng'); });
    }; });
    document.querySelectorAll('[data-mo]').forEach(function(b){ b.onclick = function(){ if (b.disabled) return; st.mode = b.dataset.mo; draw(); }; });
    if ($('un')) $('un').onchange = function(){ st.until = this.value; draw(); };
    document.querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ save(b.dataset.f); }; });
    if ($('rst')) $('rst').onclick = function(){ save(''); };
  }
  function save(v){
    var to = st.mode === 'one' ? date : st.mode === 'end' ? ds[ds.length - 1] : st.until;
    var list = ds.filter(function(d){ return d >= date && d <= to; });
    closeLayer();
    var before = {};
    list.forEach(function(d){ var key = mid + '_' + d; before[key] = a.cells[key] ? { h: a.cells[key].h, f: a.cells[key].f } : null; var cc = a.cells[key] || { h: '', f: '' }; cc.f = v; a.cells[key] = cc; });
    S.keepScroll = true; renderMaster();
    admSave('apiSetFinal', a.period.id, mid, list, v).then(function(){ toast(m.name + ' ' + (list.length > 1 ? md(list[0]) + '〜' + md(list[list.length - 1]) + '（' + list.length + '日分）' : md(date)) + ' を保存しました', 'ok'); })
      .catch(function(e){ if (!S.adm) return; Object.keys(before).forEach(function(key){ if (before[key]) a.cells[key] = before[key]; else delete a.cells[key]; }); S.keepScroll = true; renderMaster(); toast('保存されていません。' + e.message, 'ng'); });
  }
  draw();
}

/* ===== 日別台数 ===== */
function renderCap(){
  var a = S.adm;
  if (!a.period) return noPeriod();
  var ds = a.dates;
  var last = null;
  ds.forEach(function(d){ var c = a.capacity[d]; if (c && c.at && (!last || c.at > last.at)) last = c; });
  var avail = ds.map(function(d){
    var r = [0,0,0];
    a.members.forEach(function(m){ var f = effF(cellOf(m.id, d)); if (f === '○'){ r[0]++; r[1]++; } else if (f === 'CX') r[0]++; else if (f === 'MX') r[1]++; else if (f === 'SX') r[2]++; });
    return r;
  });
  var h = '<div class="wide"><div class="bar">' + periodSelect() + '<div class="sp"></div>' +
    (canEdit() ? (S.capEdit ? '<button class="btn sec" id="ccl">やめる</button><button class="btn go" id="csv">保存</button>' : '<button class="btn sec" id="ced">手で直す</button><button class="btn pri" id="cimp" title="準備中">Cortexのスクショを取り込む（準備中）</button>') : '') + '</div>';
  h += '<div class="hd"><h2>日別台数</h2><span class="upd">' + (last ? '最終更新 ' + esc(last.at.slice(5,16).replace('-', '/')) + ' ・ ' + esc(last.byName || '') : 'まだ入力されていません') + '</span></div>';
  h += '<div class="tw"><table class="c"><thead><tr><th class="nm"></th>' + ds.map(function(d){ return '<th class="' + wcls(d) + (d === a.today ? ' tdy' : '') + '"><b style="display:block;font-size:17px;font-weight:900">' + md(d) + '</b><small style="font-size:12px;color:var(--sub);font-weight:700">' + WD[wdOf(d)] + (d === a.today ? '・本日' : '') + '</small></th>'; }).join('') + '</tr></thead><tbody>';
  var n = ds.length + 1;
  function row(lbl, sub, f){ return '<tr><th class="nm">' + lbl + (sub ? '<small>' + sub + '</small>' : '') + '</th>' + ds.map(function(d, ix){ return '<td class="' + wcls(d) + '">' + f(d, ix) + '</td>'; }).join('') + '</tr>'; }
  function v(x){ return x === '' || x == null ? '−' : x; }
  function sum3(arr){ if (!arr || arr[0] === '') return '−'; return arr.reduce(function(s, x){ return s + (Number(x) || 0); }, 0); }
  function inp(d, k, ix, val){ return '<input inputmode="numeric" data-d="' + d + '" data-k="' + k + '" data-i="' + ix + '" value="' + esc(val == null ? '' : val) + '" aria-label="' + k + '">'; }
  h += '<tr class="grp am"><th colspan="' + n + '">AMAZON（Cortexの数字）</th></tr>';
  if (S.capEdit){
    h += row('ルートターゲット', '', function(d){ var c = a.capacity[d] || {}; return inp(d, 'target', 0, c.target); });
    h += row('割り当てルート', 'CX／MX／SX', function(d){ var c = a.capacity[d] || { asg: ['','',''] }; return '<div class="trip">' + [0,1,2].map(function(i){ return inp(d, 'asg', i, c.asg[i]); }).join('') + '</div>'; });
    h += row('DSPキャパシティ', 'CX／MX／SX', function(d){ var c = a.capacity[d] || { cap: ['','',''] }; return '<div class="trip">' + [0,1,2].map(function(i){ return inp(d, 'cap', i, c.cap[i]); }).join('') + '</div>'; });
  } else {
    h += row('ルートターゲット', '', function(d){ var c = a.capacity[d]; return '<span class="big">' + v(c && c.target) + '</span>'; });
    h += row('割り当てルート', '合計　CX／MX／SX', function(d){ var c = a.capacity[d]; return c ? '<div class="two"><b>' + sum3(c.asg) + '</b><span>' + c.asg.map(v).join('／') + '</span></div>' : '−'; });
    h += row('DSPキャパシティ', '合計　CX／MX／SX', function(d){ var c = a.capacity[d]; return c ? '<div class="two"><b>' + sum3(c.cap) + '</b><span>' + c.cap.map(v).join('／') + '</span></div>' : '−'; });
  }
  h += '<tr class="grp tt"><th colspan="' + n + '">TTGG（確定勤務から自動）</th></tr>';
  h += row('出せる台数', '合計　CX／MX／SX', function(d, ix){ var r = avail[ix]; return '<div class="two"><b>' + (r[0] + r[1] + r[2]) + '</b><span>' + r.join('／') + '</span></div>'; });
  h += row('割り当てとの差', 'CX／MX／SX', function(d, ix){
    var c = a.capacity[d]; if (!c || c.asg[0] === '') return '−';
    return ['CX','MX','SX'].map(function(nm, i){ var df = avail[ix][i] - (Number(c.asg[i]) || 0); return '<div class="dr"><i>' + nm + '</i>' + (df < 0 ? '<span class="ngp">不足' + (-df) + '</span>' : df === 0 ? '<span class="okk">±0</span>' : '<span class="ovr">+' + df + '</span>') + '</div>'; }).join('');
  });
  h += '</tbody></table></div><div class="capnote">「出せる台数」は仮の数え方です（○＝CXとMXに1台ずつ、CX/MX/SXのみ＝その枠に1台、管理は数えない）。社長に確認して決めます。</div></div>';
  $('main').innerHTML = h;
  bindPsel();
  if ($('ced')) $('ced').onclick = function(){ S.capEdit = true; renderCap(); };
  if ($('ccl')) $('ccl').onclick = function(){ S.capEdit = false; renderCap(); };
  if ($('cimp')) $('cimp').onclick = function(){ toast('スクショ取り込みは次の段階で作ります'); };
  if ($('csv')) $('csv').onclick = function(){
    var map = {};
    document.querySelectorAll('table.c input').forEach(function(i){
      var d = i.dataset.d; map[d] = map[d] || { date: d, target: '', asg: ['','',''], cap: ['','',''] };
      var val = i.value.trim().replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
      if (val !== '' && !/^\d{1,3}$/.test(val)){ i.style.borderColor = 'var(--ng)'; map._bad = true; }
      if (i.dataset.k === 'target') map[d].target = val; else map[d][i.dataset.k][Number(i.dataset.i)] = val;
    });
    if (map._bad){ toast('数字で入力してください', 'ng'); return; }
    var list = Object.keys(map).map(function(k){ return map[k]; });
    admCall('apiSaveCapacity', a.period.id, list, 'manual').then(function(){ S.capEdit = false; renderCap(); toast('台数を保存しました', 'ok'); }).catch(function(){});
  };
}

/* ===== 期間・セール設定 ===== */
function renderSet(){
  var a = S.adm, p = S.newP ? null : a.period;
  var h = '<div class="wrap set"><div class="bar">' + (a.periods.length ? periodSelect() : '') + '<div class="sp"></div><button class="btn pri" id="nw">＋ 新しい期間</button></div>';
  h += '<div class="card"><h3>' + (p ? '勤務表の期間' : '新しい期間を作る') + '</h3><div class="s">開始日と終了日は自由に決められます（最大62日）。</div>' +
    '<div class="fld"><div><label for="ps">開始日</label><input type="date" id="ps" value="' + (p ? p.start : '') + '"></div><div><label for="pe">終了日</label><input type="date" id="pe" value="' + (p ? p.end : '') + '"></div>' +
    '<div class="full"><label for="pd">ドライバー入力締切</label><input type="datetime-local" id="pd" value="' + (p && p.deadline ? p.deadline.replace(' ', 'T') : '') + '"></div></div>';
  if (p){
    h += '<button class="tg" id="tgA"><span><b>希望受付</b><small>' + (p.accepting ? '受付中' : '受付停止') + '（締切後も手動で再開できます）</small></span><span class="sw' + (p.accepting ? ' on' : '') + '"></span></button>';
    h += '<button class="tg" id="tgP"><span><b>ドライバーへ公開</b><small>' + (p.published ? '公開中：ドライバーが確定勤務を見られます' : '未公開') + '</small></span><span class="sw' + (p.published ? ' on' : '') + '"></span></button>';
  }
  h += '<button class="btn pri" id="psv" style="width:100%;margin-top:6px">' + (p ? '期間と締切を保存' : 'この期間を作る') + '</button>';
  if (p) h += '<button class="btn red" id="pdl" style="width:100%;margin-top:10px">この期間を削除</button>';
  if (!p && a.period) h += '<button class="linkb" id="pcn">やめる</button>';
  h += '</div>';
  h += '<div class="card"><h3>セール・インセンティブ期間</h3><div class="s">勤務表のカレンダーに「★インセンティブ対象日」と表示されます。金額や条件は載りません。</div>';
  if (!a.events.length) h += '<div class="muted" style="font-size:14px;font-weight:700;padding:8px 0">まだありません</div>';
  a.events.forEach(function(e){ h += '<div class="evl"><div class="t">★ ' + esc(e.name + ' ' + e.label) + '<small>' + e.start.replace(/-/g, '/') + ' 〜 ' + e.end.replace(/-/g, '/') + '</small></div><button class="btn red" style="height:44px" data-ev="' + e.id + '">削除</button></div>'; });
  h += '<div class="lb">追加する</div><div class="fld"><div><label for="en">名前</label><input id="en" placeholder="例：プライム感謝祭"></div><div><label for="el">区切り（任意）</label><input id="el" placeholder="例：1週目"></div><div><label for="es">開始日</label><input type="date" id="es"></div><div><label for="ee">終了日</label><input type="date" id="ee"></div></div><button class="btn sec" id="eadd" style="width:100%">＋ 追加</button></div></div>';
  $('main').innerHTML = h;
  bindPsel();
  $('nw').onclick = function(){ S.newP = true; renderSet(); };
  if ($('pcn')) $('pcn').onclick = function(){ S.newP = false; renderSet(); };
  $('psv').onclick = function(){
    var d = { id: p ? p.id : '', start: $('ps').value, end: $('pe').value, deadline: $('pd').value.replace('T', ' ') };
    if (!d.start || !d.end){ toast('開始日と終了日を入れてください', 'ng'); return; }
    admCall('apiSavePeriod', d).then(function(){ S.newP = false; renderSet(); toast('保存しました', 'ok'); }).catch(function(){});
  };
  if ($('tgA')) $('tgA').onclick = function(){ admCall('apiPeriodFlags', p.id, { accept: !p.accepting }).then(function(r){ renderSet(); toast(r.period.accepting ? '希望受付を開きました' : '希望受付を止めました', 'ok'); }).catch(function(){}); };
  if ($('tgP')) $('tgP').onclick = function(){
    var on = !p.published;
    confirmBox(on ? 'ドライバーへ公開' : '公開をやめる', on ? md(p.start) + '〜' + md(p.end) + ' の確定勤務を、全ドライバーが見られるようにします。' : 'ドライバーの画面で確定勤務が「未公開」に戻ります。', on ? '公開する' : '公開をやめる', !on)
      .then(function(ok){ if (!ok) return; admCall('apiPeriodFlags', p.id, { published: on }).then(function(){ renderSet(); toast(on ? '公開しました' : '公開をやめました', 'ok'); }).catch(function(){}); });
  };
  if ($('pdl')) $('pdl').onclick = function(){
    confirmBox('期間を削除', md(p.start) + '〜' + md(p.end) + ' の期間を削除します。<br>ドライバーの画面からも消えます。取り消せません。', '削除する', true)
      .then(function(ok){ if (!ok) return; admCall('apiDeletePeriod', p.id).then(function(){ renderSet(); toast('削除しました'); }).catch(function(){}); });
  };
  $('main').querySelectorAll('[data-ev]').forEach(function(b){ b.onclick = function(){
    confirmBox('セール期間を削除', 'このセール期間の表示を消します。', '削除する', true).then(function(ok){ if (!ok) return; admCall('apiDeleteEvent', p ? p.id : '', b.dataset.ev).then(function(){ renderSet(); toast('削除しました'); }).catch(function(){}); });
  }; });
  $('eadd').onclick = function(){
    var ev = { name: $('en').value.trim(), label: $('el').value.trim(), start: $('es').value, end: $('ee').value };
    if (!ev.name || !ev.start || !ev.end){ toast('名前・開始日・終了日を入れてください', 'ng'); return; }
    admCall('apiSaveEvent', p ? p.id : '', ev).then(function(){ renderSet(); toast('追加しました', 'ok'); }).catch(function(){});
  };
}

start();
</script>
</body>
</html>
