<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>TTGG Dispatch</title>
<style>
html,body{margin:0;background:#f4f2f9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;color:#1c1b22}
.top{background:#241a45;height:76px;border-bottom:4px solid #6a45d1}
.m{padding:60px 20px;text-align:center;font-weight:700;color:#6b6878}
.e{margin:20px auto;max-width:520px;padding:16px;border-radius:14px;background:#fde2e0;color:#8e1b1b;font-weight:800;text-align:center}
.e button{margin-top:12px;height:48px;padding:0 20px;border-radius:12px;border:0;background:#241a45;color:#fff;font:inherit;font-weight:800}
</style>
</head>
<body>
<div class="top"></div>
<div class="m" id="m">読み込み中…</div>
<script>
// 読み込み役: 画面本体は Google 側(TTGG Dispatch)から取ってくる。GitHub のこのファイルは今後さわらない。
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbzgr42NgfT385gWD2YlXZwODI6jHuvACQ9QWmw3hjo_A42Y7h9CPR79_16dvU9U-l2u/exec';
  // 本人の鍵(?k=)は読んだらアドレス欄から消し、このタブの間だけ覚えておく
  try {
    var k = new URLSearchParams(location.search).get('k') || '';
    if (/^[0-9a-f]{16,128}$/i.test(k)) { sessionStorage.setItem('disp_k', k); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
  function fail(){
    document.getElementById('m').outerHTML = '<div class="e">読み込めませんでした。通信を確認してください。<br><button onclick="location.reload()">もう一度読み込む</button></div>';
  }
  fetch(API + '?app=1&t=' + Date.now(), { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){
      if (html.indexOf('<html') < 0) throw new Error('bad');
      document.open(); document.write(html); document.close();
    })
    .catch(fail);
})();
</script>
</body>
</html>
